name: Backend Tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore backend/NievoEasyFin.Tests/test.csproj

    - name: Build
      run: dotnet build backend/NievoEasyFin.Tests/test.csproj --no-restore

    - name: Test
      run: dotnet test backend/NievoEasyFin.Tests/test.csproj --no-build --verbosity normal
